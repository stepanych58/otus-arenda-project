databaseChangeLog:
  - changeSet:
      id: init-products
      author: stepanych58
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_product
                  name: id
                  type: UUID
              - column:
                  name: user_id
                  type: UUID
              - column:
                  constraints:
                    nullable: false
                  name: name
                  type: text
              - column:
                  name: description
                  type: text
              - column:
                  constraints:
                    nullable: false
                  name: price
                  type: double
              - column:
                  constraints:
                    nullable: false
                  name: currency
                  type: text
              - column:
                  constraints:
                    nullable: false
                  name: deposit_sum
                  type: double
              - column:
                  name: quantity
                  type: int
              - column:
                  name: img_url
                  type: text
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: modified_at
                  type: DATETIME
            tableName: product
        - createTable:
              columns:
                  - column:
                        constraints:
                            nullable: false
                            primaryKey: true
                            primaryKeyName: pk_product_request
                        name: id
                        type: UUID
                  - column:
                        constraints:
                            nullable: false
                            foreignKeyName: fk_msa_product_request
                            references: product(id)
                        name: product_id
                        type: UUID
                  - column:
                        name: request_id
                        constraints:
                            nullable: false
                        type: UUID
                  - column:
                        name: created_at
                        type: DATETIME
                  - column:
                        name: modified_at
                        type: DATETIME
              tableName: msa_product_request
