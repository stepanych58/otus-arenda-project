apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.appName }}-trf
  namespace: {{ .Values.projectNamespace }}
spec:
  entryPoints:
    - web
  routes:
    # Эндпоинты Swagger
    - match: Host(`billing-service-app.localhost`) && PathPrefix(`/swagger`)
      kind: Rule
      services:
        - name: billingservice-java-service-chart
          port: 80
    - match: Host(`billing-service-app.localhost`) && PathPrefix(`/v3/api-docs`)
      kind: Rule
      services:
        - name: billingservice-java-service-chart
          port: 80

    # Эндпоинты Actuator
    - match: Host(`billing-service-app.localhost`) && PathPrefix(`/actuator`)
      kind: Rule
      services:
        - name: billingservice-java-service-chart
          port: 80

    - match: Host(`billing-service-app.localhost`) && PathPrefix(`/billing/api/v1`)
      kind: Rule
      services:
        - name: billingservice-java-service-chart
          port: 80