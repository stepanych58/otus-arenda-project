apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.appName }}-trf
  namespace: {{ .Values.projectNamespace }}
spec:
  entryPoints:
    - web
  routes:
    # Эндпоинты Swagger
    - match: Host(`order-service-app.localhost`) && PathPrefix(`/swagger`)
      kind: Rule
      services:
        - name: orderservice-java-service-chart
          port: 80
    - match: Host(`order-service-app.localhost`) && PathPrefix(`/v3/api-docs`)
      kind: Rule
      services:
        - name: orderservice-java-service-chart
          port: 80

    # Эндпоинты Actuator
    - match: Host(`order-service-app.localhost`) && PathPrefix(`/actuator`)
      kind: Rule
      services:
        - name: orderservice-java-service-chart
          port: 80

    # Эндпоинты приложения
    - match: Host(`order-service-app.localhost`) && PathPrefix(`/order-service/api/v1`)
      kind: Rule
      services:
        - name: orderservice-java-service-chart
          port: 80
      middlewares:
        - name: keycloak-forward-auth
    - match: Host(`order-service-app.localhost`) && PathPrefix(`/order-service/admin-api/v1`)
      kind: Rule
      services:
        - name: orderservice-java-service-chart
          port: 80
      middlewares:
        - name: keycloak-forward-auth
